name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      - name: Build
        run: npm run build
        env:
          # the build only statically analyzes routes (all of them are
          # dynamic here), it never actually connects — a well-formed but
          # fake URL is enough to satisfy the config's presence check
          DATABASE_URL: postgresql://user:password@localhost/db
